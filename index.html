<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EPUB Reader</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg: #f5f2eb;
      --panel-bg: #eae6df;
      --text: #2c2c2b;
      --accent: #1b5e55;
      --accent-hover: #144740;
      --border: #d8d3c9;
      --card-bg: #ffffff;
      --font-size: 18px;
      --line-height: 1.6;
      --font-family: serif;
    }

    [data-theme="dark"] {
      --bg: #1a1a1a;
      --panel-bg: #242424;
      --text: #e0e0e0;
      --accent: #4db6ac;
      --accent-hover: #80cbc4;
      --border: #333333;
      --card-bg: #2a2a2a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      height: 50px;
      background-color: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      color: var(--accent);
      font-size: 1.1rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn {
      background: none;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .btn:hover { background-color: rgba(0,0,0,0.05); }

    .btn-primary {
      background-color: var(--accent);
      color: white;
      border: none;
      font-weight: 600;
    }

    .btn-primary:hover { background-color: var(--accent-hover); }

    .main-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 90px);
    }

    sidebar {
      width: 260px;
      background-color: var(--panel-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 15px;
      gap: 15px;
      overflow-y: auto;
    }

    .meta-box {
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .meta-title { font-weight: bold; color: var(--text); }

    .search-box {
      display: flex;
      gap: 4px;
    }

    .search-box input {
      flex: 1;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font-size: 0.85rem;
    }

    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 40px;
      display: flex;
      justify-content: center;
    }

    #viewer {
      width: 100%;
      max-width: 750px;
      font-size: var(--font-size);
      line-height: var(--line-height);
      font-family: var(--font-family);
    }

    #viewer img { max-width: 100%; height: auto; }

    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      margin: auto;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      cursor: pointer;
    }

    .drop-zone-icon {
      font-size: 2rem;
      color: var(--accent);
    }

    footer {
      height: 40px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      background-color: var(--bg);
    }

    /* Modals/Panels */
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-content {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      width: 90%;
      max-width: 400px;
      border: 1px solid var(--border);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .toc-item, .library-item {
      padding: 8px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      font-size: 0.9rem;
    }

    .toc-item:hover, .library-item:hover {
      background-color: rgba(0,0,0,0.05);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
      </svg>
      EPUB
    </div>

    <div class="header-actions">
      <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">Отвори</button>
      <button class="btn" id="btnToc" title="Съдържание">☰</button>
      <button class="btn" id="btnBookmarks" title="Отметки">🔖</button>
      <button class="btn" id="btnNotes" title="Бележки">📝</button>
      <button class="btn" id="btnFont" title="Шрифт">Aa</button>
      <button class="btn" id="btnLibrary" title="Библиотека">📚</button>
      <button class="btn" id="btnSearch" title="Търсене">🔍</button>
      <button class="btn" id="btnTheme" title="Тема">☀️</button>
      <button class="btn" id="btnFullscreen" title="Цял екран">⛶</button>
    </div>
  </header>

  <div class="main-container">
    <sidebar>
      <div class="meta-box">
        <span style="color: #888;">Заглавие</span>
        <span class="meta-title" id="lblTitle">-</span>
      </div>
      <div class="meta-box">
        <span style="color: #888;">Автор</span>
        <span class="meta-title" id="lblAuthor">-</span>
      </div>
      <div class="search-box">
        <input type="text" id="txtSearchChapter" placeholder="Търси в главата...">
        <button class="btn" id="btnSearchChapter">🔍</button>
      </div>
      <div id="sidebarToc" style="margin-top: 10px; font-size: 0.85rem;"></div>
    </sidebar>

    <div class="content-area" id="contentArea">
      <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <div class="drop-zone-icon">📖</div>
        <div>Провлачи .epub тук или кликни</div>
        <div style="font-size: 1.1rem; font-weight: bold; margin-top: 15px;">Локален EPUB четец</div>
        <div style="font-size: 0.85rem; color: #777;">Работи изцяло в браузъра — данните ти остават при теб.</div>
        <div style="font-size: 0.75rem; color: #999; margin-top: 10px;">← → клавиши или swipe за глави</div>
      </div>
      <div id="viewer" style="display: none;"></div>
    </div>
  </div>

  <footer>
    <button class="btn" id="btnPrev">◀</button>
    <span id="lblProgress" style="font-size: 0.85rem; color: #777;">-</span>
    <button class="btn" id="btnNext">▶</button>
  </footer>

  <input type="file" id="fileInput" accept=".epub" style="display: none;">

  <!-- Modals -->
  <div class="modal" id="modalLibrary">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Моята библиотека</h3>
        <button class="btn" onclick="closeModals()">✕</button>
      </div>
      <div id="libraryList"></div>
    </div>
  </div>

  <script>
    const state = {
      zip: null,
      opfPath: '',
      rootPath: '',
      spine: [],
      toc: [],
      curChapter: 0,
      meta: { title: '', author: '' },
      bookKey: ''
    };

    let DB = null;

    function initDB() {
      return new Promise((resolve) => {
        const req = indexedDB.open('epub_original_db', 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('books')) {
            db.createObjectStore('books', { keyPath: 'k' });
          }
        };
        req.onsuccess = (e) => {
          DB = e.target.result;
          resolve(DB);
        };
        req.onerror = () => resolve(null);
      });
    }

    async function saveToDB(fileBlob, fileName) {
      if (!DB) await initDB();
      if (!DB) return;
      const tx = DB.transaction('books', 'readwrite');
      tx.objectStore('books').put({
        k: state.bookKey,
        title: state.meta.title || fileName,
        author: state.meta.author || 'Неизвестен',
        blob: fileBlob,
        ts: Date.now()
      });
    }

    function getStoredBooks() {
      return new Promise((resolve) => {
        if (!DB) return resolve([]);
        const tx = DB.transaction('books', 'readonly');
        const req = tx.objectStore('books').getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => resolve([]);
      });
    }

    async function loadEpub(file, isNew = true) {
      try {
        state.zip = await JSZip.loadAsync(file);
        const container = await state.zip.file("META-INF/container.xml").async("string");
        const doc = new DOMParser().parseFromString(container, "application/xml");
        state.opfPath = doc.querySelector("rootfile").getAttribute("full-path");
        
        const p = state.opfPath.split('/');
        p.pop();
        state.rootPath = p.length ? p.join('/') + '/' : '';

        const opfStr = await state.zip.file(state.opfPath).async("string");
        const opfDoc = new DOMParser().parseFromString(opfStr, "application/xml");

        const t = opfDoc.querySelector("title");
        const c = opfDoc.querySelector("creator");
        state.meta.title = t ? t.textContent : file.name;
        state.meta.author = c ? c.textContent : "Неизвестен";

        document.getElementById("lblTitle").innerText = state.meta.title;
        document.getElementById("lblAuthor").innerText = state.meta.author;

        const manifest = {};
        opfDoc.querySelectorAll("manifest > item").forEach(it => {
          manifest[it.getAttribute("id")] = it.getAttribute("href");
        });

        state.spine = [];
        opfDoc.querySelectorAll("spine > itemref").forEach(ref => {
          const id = ref.getAttribute("idref");
          if (manifest[id]) state.spine.push(state.rootPath + manifest[id]);
        });

        let h = 0;
        const s = state.meta.title + state.meta.author;
        for (let i = 0; i < s.length; i++) h = (Math.imul(31, h) + s.charCodeAt(i)) | 0;
        state.bookKey = 'bk_' + (h >>> 0).toString(36);

        if (isNew) {
          await saveToDB(file, file.name);
        }

        document.getElementById("dropZone").style.display = "none";
        document.getElementById("viewer").style.display = "block";

        renderChapter(0);
      } catch (e) {
        alert("Грешка при зареждане на книгата!");
        console.error(e);
      }
    }

    async function renderChapter(idx) {
      if (idx < 0 || idx >= state.spine.length) return;
      state.curChapter = idx;
      
      const fileStr = await state.zip.file(state.spine[idx]).async("string");
      const doc = new DOMParser().parseFromString(fileStr, "text/html");

      const imgs = doc.querySelectorAll("img");
      for (let img of imgs) {
        let src = img.getAttribute("src");
        if (src && !src.startsWith("http")) {
          try {
            const imgPath = state.rootPath + src;
            const b64 = await state.zip.file(imgPath).async("base64");
            img.setAttribute("src", "data:image/png;base64," + b64);
          } catch(e){}
        }
      }

      document.getElementById("viewer").innerHTML = doc.body.innerHTML;
      document.getElementById("contentArea").scrollTop = 0;
      document.getElementById("lblProgress").innerText = `${idx + 1} / ${state.spine.length}`;
    }

    // Drag & Drop
    const dz = document.getElementById("dropZone");
    dz.addEventListener("dragover", (e) => e.preventDefault());
    dz.addEventListener("drop", (e) => {
      e.preventDefault();
      if (e.dataTransfer.files.length) loadEpub(e.dataTransfer.files[0], true);
    });

    document.getElementById("fileInput").addEventListener("change", (e) => {
      if (e.target.files.length) loadEpub(e.target.files[0], true);
    });

    document.getElementById("btnPrev").addEventListener("click", () => renderChapter(state.curChapter - 1));
    document.getElementById("btnNext").addEventListener("click", () => renderChapter(state.curChapter + 1));

    document.getElementById("btnLibrary").addEventListener("click", async () => {
      const list = await getStoredBooks();
      const el = document.getElementById("libraryList");
      el.innerHTML = "";
      if (!list.length) {
        el.innerHTML = "<div style='padding:10px;'>Няма запазени книги.</div>";
      } else {
        list.forEach(b => {
          const item = document.createElement("div");
          item.className = "library-item";
          item.innerText = `${b.title} (${b.author})`;
          item.onclick = () => {
            loadEpub(b.blob, false);
            closeModals();
          };
          el.appendChild(item);
        });
      }
      document.getElementById("modalLibrary").style.display = "flex";
    });

    function closeModals() {
      document.querySelectorAll(".modal").forEach(m => m.style.display = "none");
    }

    initDB();
  </script>
</body>
</html>
